<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 330">
  <!-- Original illustration for momentum-control: an over-ear headset seen from
       the front, drawn flat to sit on the app's dark panels. -->
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a55"/>
      <stop offset="1" stop-color="#26262e"/>
    </linearGradient>
    <linearGradient id="fabric" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c5c68"/>
      <stop offset="1" stop-color="#3a3a44"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2a31"/>
      <stop offset="0.5" stop-color="#4d4d57"/>
      <stop offset="1" stop-color="#2a2a31"/>
    </linearGradient>
    <linearGradient id="cushion" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b1b21"/>
      <stop offset="1" stop-color="#2c2c34"/>
    </linearGradient>
    <radialGradient id="cupL" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#3b3b45"/>
      <stop offset="0.6" stop-color="#1f1f26"/>
      <stop offset="1" stop-color="#121217"/>
    </radialGradient>
    <radialGradient id="cupR" cx="0.62" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#3b3b45"/>
      <stop offset="0.6" stop-color="#1f1f26"/>
      <stop offset="1" stop-color="#121217"/>
    </radialGradient>
  </defs>

  <!-- headband: a dark shell with a lighter fabric top -->
  <path d="M58 168 C58 70 98 28 150 28 C202 28 242 70 242 168" fill="none" stroke="url(#band)" stroke-width="24" stroke-linecap="round"/>
  <path d="M66 150 C68 80 104 42 150 42 C196 42 232 80 234 150" fill="none" stroke="url(#fabric)" stroke-width="10" stroke-linecap="round"/>
  <path d="M74 132 C80 84 110 54 150 54 C190 54 220 84 226 132" fill="none" stroke="#6b6b78" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round"/>

  <!-- sliders and yokes -->
  <rect x="50" y="160" width="16" height="44" rx="5" fill="url(#arm)"/>
  <rect x="234" y="160" width="16" height="44" rx="5" fill="url(#arm)"/>
  <path d="M44 204 Q58 196 72 204" fill="none" stroke="#3a3a44" stroke-width="5" stroke-linecap="round"/>
  <path d="M228 204 Q242 196 256 204" fill="none" stroke="#3a3a44" stroke-width="5" stroke-linecap="round"/>

  <!-- cushions, seen past the inner edge of each cup -->
  <ellipse cx="80" cy="250" rx="30" ry="58" fill="url(#cushion)"/>
  <ellipse cx="220" cy="250" rx="30" ry="58" fill="url(#cushion)"/>

  <!-- ear cups -->
  <ellipse cx="58" cy="250" rx="44" ry="64" fill="url(#cupL)" stroke="#34343e" stroke-width="2"/>
  <ellipse cx="242" cy="250" rx="44" ry="64" fill="url(#cupR)" stroke="#34343e" stroke-width="2"/>
  <ellipse cx="58" cy="250" rx="33" ry="51" fill="none" stroke="#2a2a32" stroke-width="2"/>
  <ellipse cx="242" cy="250" rx="33" ry="51" fill="none" stroke="#2a2a32" stroke-width="2"/>
  <path d="M30 222 Q38 200 56 194" fill="none" stroke="#5a5a66" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
  <path d="M270 222 Q262 200 244 194" fill="none" stroke="#5a5a66" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>

  <!-- status light -->
  <circle cx="242" cy="298" r="2.6" fill="#8b5cf6"/>
</svg>
